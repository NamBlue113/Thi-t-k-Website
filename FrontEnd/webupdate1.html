<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening IELTS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── LIGHT THEME ── */
:root,[data-theme="light"]{
  --blue:#1A6FD4;--blue-dark:#0E4FA0;--blue-light:#E8F1FC;
  --accent:#F5A623;--accent-light:#FEF3DC;
  --bg:#F4F6FB;--surface:#FFFFFF;--border:#E2E8F2;
  --text-primary:#111827;--text-secondary:#6B7A99;--text-muted:#A0AABF;
  --radius:14px;--radius-sm:8px;
  --shadow:0 8px 28px rgba(26,111,212,.10);
  --modal-overlay:rgba(15,23,42,.45);
}

/* ── DARK THEME ── */
[data-theme="dark"]{
  --blue:#4A9EF0;--blue-dark:#2A7FD4;--blue-light:#1A2E44;
  --accent:#F5A623;--accent-light:#3A2800;
  --bg:#0F1623;--surface:#1A2232;--border:#2A3550;
  --text-primary:#E8EDF5;--text-secondary:#8A9BBB;--text-muted:#4A5A7A;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --modal-overlay:rgba(0,0,0,.65);
}

/* ── PREMIUM GOLD THEME ── */
body.is-premium {
  --premium-gold: #D97706;
  --premium-gold-light: #FEF3C7;
  --premium-gold-border: #F59E0B;
  --premium-gold-dark: #92400E;
  --premium-glow: 0 0 0 2px #F59E0B40;
}

body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;transition:background .3s,color .3s}

/* ... (giữ nguyên toàn bộ CSS cũ của bạn) ... */

/* ── PLAYBACK SPEED CONTROL ── */
.speed-control {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0 16px 0;
  font-size: 14px;
}

.speed-control label {
  font-weight: 500;
  color: var(--text-secondary);
  white-space: nowrap;
}

.speed-select {
  padding: 6px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text-primary);
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
  transition: all .15s;
}

.speed-select:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(26,111,212,.15);
}

body.is-premium .speed-select:focus {
  border-color: #F59E0B;
  box-shadow: 0 0 0 3px rgba(245,158,11,.15);
}

[data-theme="dark"] .speed-select {
  background: var(--bg);
}

/* Giữ nguyên phần CSS cũ từ đây trở xuống (tôi rút gọn để tiết kiệm chỗ) */
</style>
</head>
<script src="https://www.youtube.com/iframe_api"></script>
<body>

<!-- (Giữ nguyên toàn bộ HTML từ NAV đến các modal) -->

<!-- PAGE: EXERCISE -->
<div id="page-exercise" class="page">
  <div class="exercise-wrap">
    <div class="breadcrumb">
      <a onclick="showPage('home')">All topics</a>
      <span>/</span>
      <span id="ex-title-crumb">Lesson</span>
    </div>
    <h1 id="ex-title-h1">Lesson</h1>
    <div id="sections-container"></div>
  </div>
  <footer>© 2026 ListeningIELTS · Luyện nghe tiếng Anh mỗi ngày</footer>
</div>

<!-- Các modal khác giữ nguyên -->

<script>
/* ─── STATE ─── */
let isPremium = false;
const API_BASE_URL = "https://thi-t-k-website.onrender.com/api";

let currentQuestion = null;
let currentSection = null;
let currentQuestionIndex = 0;
let currentSegmentIndex = 0;
let youtubePlayer = null;
let videoPauseInterval = null;
let currentSegment = null;
let questionStartTime = null;

/** ================== PLAYBACK SPEED ================== */
let currentPlaybackSpeed = 1.0;

/* ================== PREMIUM & OTHER FUNCTIONS (giữ nguyên) ================== */
function activatePremium() { /* ... giữ nguyên */ }

/* ================== THEME, NAV, MODAL... (giữ nguyên) ================== */

/* ================== PLAYBACK SPEED FUNCTIONS ================== */
function changeSpeed(speed) {
  currentPlaybackSpeed = parseFloat(speed);

  const audio = document.getElementById('questionAudio');
  if (audio) audio.playbackRate = currentPlaybackSpeed;

  if (youtubePlayer && typeof youtubePlayer.setPlaybackRate === 'function') {
    youtubePlayer.setPlaybackRate(currentPlaybackSpeed);
  }
}

function applySpeedToPlayer() {
  const audio = document.getElementById('questionAudio');
  if (audio) {
    audio.playbackRate = currentPlaybackSpeed;
  }

  if (youtubePlayer && typeof youtubePlayer.setPlaybackRate === 'function') {
    youtubePlayer.setPlaybackRate(currentPlaybackSpeed);
  }
}

/* ================== OPEN EXERCISE ================== */
async function openExercise(title, isVideo) {
  window.currentIsVideo = isVideo;

  if (videoPauseInterval) clearInterval(videoPauseInterval);
  if (youtubePlayer) { try { youtubePlayer.destroy(); } catch(e){} youtubePlayer = null; }

  currentSegmentIndex = 0;
  currentSegment = null;

  document.getElementById('ex-title-crumb').textContent = title;
  document.getElementById('ex-title-h1').textContent = title;

  const container = document.getElementById('sections-container');

  container.innerHTML = `
    <div class="section-detail open">
      ${isVideo
        ? `<div class="yt-wrap"><div id="questionVideo"></div></div>`
        : `<audio id="questionAudio" controls src=""></audio>`
      }

      <!-- Playback Speed Control -->
      <div class="speed-control">
        <label>Tốc độ:</label>
        <select id="playbackSpeed" class="speed-select" onchange="changeSpeed(this.value)">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1.0x (Bình thường)</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
      </div>

      <div style="margin-bottom:12px">
        <strong id="questionText">Loading question...</strong>
      </div>

      <textarea id="answerInput" placeholder="Type what you hear..."></textarea>

      <br>
      <button class="btn-check" id="submitBtn" onclick="submitAnswer()">Check</button>
      <button class="btn-skip" onclick="nextQuestion(${isVideo})">Skip</button>
      <button class="btn-next-segment" id="nextSegmentBtn" onclick="nextSegment()">Next Segment ▶</button>

      <div id="attemptResult" style="margin-top:16px"></div>
    </div>
  `;

  await loadRealSection(title, isVideo);
  showPage('exercise');
}

/* ================== RENDER QUESTION (ĐÃ CẬP NHẬT) ================== */
function renderCurrentQuestion(isVideo) {
  currentSegmentIndex = 0;
  currentSegment = currentSection.segments?.[currentSegmentIndex];
  questionStartTime = Date.now();

  const segments = currentSection.segments || [];
  const hasSegments = segments.length > 0;

  document.getElementById("questionText").textContent = 
    hasSegments 
      ? `Segment ${currentSegmentIndex + 1}/${segments.length}` 
      : (currentSection.title || "Listening Exercise");

  if (isVideo) {
    const videoId = extractYoutubeId(currentSection.youtubeUrl);
    if (!youtubePlayer) {
      youtubePlayer = new YT.Player("questionVideo", {
        videoId: videoId,
        playerVars: { rel: 0, controls: 1 },
        events: {
          onReady: () => {
            applySpeedToPlayer();
            if (hasSegments) playSegment();
          }
        }
      });
    } else {
      youtubePlayer.loadVideoById(videoId);
      setTimeout(applySpeedToPlayer, 800);
    }
  } else {
    const audioEl = document.getElementById("questionAudio");
    if (audioEl) {
      audioEl.src = currentSection.audioUrl || "";
      audioEl.onloadedmetadata = () => applySpeedToPlayer();
    }
  }

  document.getElementById("answerInput").value = "";
  document.getElementById("answerInput").classList.remove("input-shake");

  const resultDiv = document.getElementById("attemptResult");
  if (resultDiv) {
    resultDiv.innerHTML = hasSegments ? `
      <div class="segment-info">
        <span>📝</span>
        <span>Segment <strong>${currentSegmentIndex + 1}</strong> of <strong>${segments.length}</strong></span>
      </div>` : "";
  }

  const nextBtn = document.getElementById("nextSegmentBtn");
  if (nextBtn) nextBtn.classList.remove("show");
}

/* ================== OTHER FUNCTIONS (giữ nguyên + bổ sung) ================== */
function playSegment() { /* giữ nguyên */ }

function nextSegment() {
  // ... code cũ ...
  setTimeout(() => {
    applySpeedToPlayer();
  }, 300);
}

function nextQuestion(isVideo) {
  if (videoPauseInterval) clearInterval(videoPauseInterval);

  currentQuestionIndex++;
  if (currentQuestionIndex >= window.currentSections.length) {
    alert("Completed all questions!");
    showPage("home");
    return;
  }

  currentSection = window.currentSections[currentQuestionIndex];
  renderCurrentQuestion(isVideo);
  applySpeedToPlayer();           // ← Giữ tốc độ khi chuyển câu
  setButtonsDisabled(false);
}

/* Các hàm còn lại giữ nguyên (loadRealSection, submitAnswer, ...) */
async function loadRealSection(topicTitle, isVideo) { /* giữ nguyên */ }
function extractYoutubeId(url) { /* giữ nguyên */ }
function setButtonsDisabled(disabled) { /* giữ nguyên */ }
function submitAnswer() { /* giữ nguyên */ }

/* Khởi tạo theme, modal, v.v. (giữ nguyên) */
(function() {
  const saved = localStorage.getItem('listeningielts-theme');
  if (saved) applyTheme(saved);
})();
</script>
</body>
</html>
